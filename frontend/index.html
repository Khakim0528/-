<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Свежо — магазин продуктов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap bar">
      <a class="logo" href="#/">🥬 Свежо</a>
      <input id="search" class="search" type="search" placeholder="Поиск продуктов…" aria-label="Поиск">
      <nav class="nav">
        <a href="#/orders" data-nav="orders" hidden>Заказы</a>
        <a href="#/admin" data-nav="admin" hidden>Админ</a>
        <button class="btn ghost" data-action="open-cart" aria-label="Корзина">🛒 <span id="cartCount" class="badge">0</span></button>
        <button class="btn ghost" id="accountBtn" data-action="account">Войти</button>
      </nav>
    </div>
  </header>

  <main class="wrap" id="view"></main>

  <div id="overlay" class="overlay" data-action="close-cart"></div>
  <aside id="drawer" class="drawer" aria-label="Корзина">
    <div class="drawer-head"><h2>Корзина</h2><button class="icon" data-action="close-cart" aria-label="Закрыть">✕</button></div>
    <div id="cartBody" class="drawer-body"></div>
    <div class="drawer-foot" id="cartFoot"></div>
  </aside>

  <dialog id="authDlg">
    <form id="authForm" class="form">
      <div class="tabs">
        <button type="button" class="tab active" data-auth-tab="login">Вход</button>
        <button type="button" class="tab" data-auth-tab="register">Регистрация</button>
      </div>
      <label class="reg-only">Имя<input name="full_name" autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Пароль<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
      <p class="error" id="authError"></p>
      <div class="row"><button type="button" class="btn ghost" data-action="close-dialog">Отмена</button><button class="btn primary" id="authSubmit">Войти</button></div>
    </form>
  </dialog>

  <dialog id="checkoutDlg">
    <form id="checkoutForm" class="form">
      <h2>Оформление заказа</h2>
      <label>Адрес доставки<input name="address" required minlength="5" placeholder="Город, улица, дом, квартира"></label>
      <label>Телефон<input name="phone" required minlength="5" type="tel" placeholder="+998 90 123 45 67"></label>
      <label>Комментарий<textarea name="comment" rows="2" placeholder="Домофон, время доставки…"></textarea></label>
      <p class="error" id="checkoutError"></p>
      <div class="row"><button type="button" class="btn ghost" data-action="close-dialog">Отмена</button><button class="btn primary">Заказать</button></div>
    </form>
  </dialog>

  <dialog id="productDlg">
    <form id="productForm" class="form">
      <h2 id="productTitle">Товар</h2>
      <label>Название<input name="name" required></label>
      <label>Описание<textarea name="description" rows="2"></textarea></label>
      <div class="grid2">
        <label>Цена<input name="price" type="number" step="0.01" min="0.01" required></label>
        <label>Остаток<input name="stock" type="number" min="0" step="1" required></label>
        <label>Единица
          <select name="unit"><option value="pcs">шт</option><option value="kg">кг</option><option value="l">л</option><option value="pack">уп</option></select>
        </label>
        <label>Категория<select name="category_id"></select></label>
      </div>
      <label>Ссылка на картинку (необязательно)<input name="image_url" type="url"></label>
      <label class="check"><input name="is_active" type="checkbox" checked> Виден в каталоге</label>
      <p class="error" id="productError"></p>
      <div class="row"><button type="button" class="btn ghost" data-action="close-dialog">Отмена</button><button class="btn primary">Сохранить</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
